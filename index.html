<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title> Grill Shack </title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

<style>
:root{
  --bg:#0b0b10;
  --text:#f6f6fb;
  --muted:#bfc0d0;
  --stroke:#ffffff12;
  --brand:#ff6a00;
}

*{box-sizing:border-box}

body{
    background: linear-gradient(
        135deg,
      #000000,
        #1a1a1a,
        #000000
    );
    background-size: 300% 300%;
    animation: gradientMove 15s ease infinite;
  overflow-x:hidden;
}

@keyframes gradientMove{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

.wrap{
  max-width:420px;
  margin:auto;
  padding:22px 14px 40px;
}

.header{text-align:center}

.logo{
  width:350px;
  margin:1px auto 2px;
  text-align:center;
}

.logo img{
  width:100%;
  height:auto;
  display:block;
  margin:auto;
}

h1{
    margin:0;
    font-size:22px;
    color:#ffffff;
}

.tagline{
  color:#d9d9d9;
  font-size:16px;
  margin:8px 0 12px;
  
}

.social{
  display:flex;
  justify-content:center;
  gap:10px;
  margin:10px 0 14px;
}

.sbtn{
  width:42px;
  height:42px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:rgba(255,255,255,.06);
  border:1px solid var(--stroke);
  color:#fff;
  text-decoration:none;
}

.map{
  margin:8px 0 14px;
  border-radius:18px;
  overflow:hidden;
  border:1px solid var(--stroke);
}

.map iframe{
  width:100%;
  height:180px;
  border:0;
  display:block;
}

.map a{
  display:block;
  text-align:center;
  padding:10px;
  background:rgba(0,0,0,.35);
  color:#fff;
  text-decoration:none;
  font-size:13px;
}


.list{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.btn{
 position: relative;
  display: block;
  width:100%;
  padding:14px;
  margin-bottom:12px;
  border-radius:16px;
  text-decoration:none;

  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,0.12);
  color: #fff !important;
}

.btn b{
  color:#fff !important;
}
.ic{
  position:absolute;
  left:0;
  background:transparent !important;
  border:none !important;
  width:40px;
  text-align:center;
  font-size:28px;
  color:#fff !important;
}

.left{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:14px;

  width:100%;
}

.txt{
    flex: 1;
    text-align: center;
}

.txt b{
    font-size: 20px;
    white-space: nowrap;
}

.txt small{
  color:var(--muted);
  font-size:20px;
}

.footer{
  text-align:center;
  color:#bdbdd0;
  font-size:15px;
  margin-top:20px;
}

.footer a{
  color:#bdbdd0;
  text-decoration:none;
}
</style>
</head>

<body>

<div class="wrap">

<div class="header">


<div class="logo">
<img src="Grill Shack1.png" alt="Grill Shack"
onerror="this.remove(); this.parentElement.innerHTML='TT';">
</div>

<h1>Grill Shack</h1>

<div class="tagline">
"وجبتك, قهوتك، وحلاك.. عندنا وبس سر الصنعة.. في كل لقمة"
  <br>
"شاورما على اصولها، وبرغر على كيف كيفك"
  <br>
"طعم يجمعنا، وجودة تفرقنا"
</div>


  <a class="btn" href="https://search.google.com/local/writereview?placeid=ChIJg9GsxRRZGxURPqAWih27iCE" target="_blank">
<div class="left">
<div class="ic"><i class="fa-brands fa-google"></i></div>
<div class="txt">
<b>Google Reviews</b>
</div>
</div>
</a>
  
<a class="btn" href="https://www.instagram.com/shack.grill" target="_blank">
<div class="left">
<div class="ic"><i class="fa-brands fa-instagram"></i></div>
<div class="txt">
<b>Instagram</b>
</div>
</div>
</a>


<a class="btn" href="https://www.facebook.com/GrillShak" target="_blank">
<div class="left">
<div class="ic"><i class="fa-brands fa-facebook-f"></i></div>
<div class="txt">
<b>Facebook</b>
</div>
</div>
</a>


  <div class="map">
<iframe 
src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d4054.613922542086!2d35.99020309999999!3d31.868423399999998!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x151b5914c5acd183%3A0x2188bb1d8a16a03e!2sGrill%20Shack!5e1!3m2!1sen!2sjo!4v1794600912085!5m2!1sen!2sjo"
loading="lazy"
allowfullscreen
referrerpolicy="no-referrer-when-downgrade">
</iframe>
<a href="https://www.google.com/maps?cid=2416386935629455422" target="_blank">See Our Location</a>
</div>

</div>

  
<div class="footer">
<a href="https://www.instagram.com/touc.htag" target="_blank">© TouchTag</a>
</div>

</div>

</body>
</html>
